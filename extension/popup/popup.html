<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Autonomous Job Kit Autofill</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" width="24" height="24">
    <h1>Autonomous Job Kit Autofill</h1>
  </header>
  <p id="profile-line" class="muted">Loading profile…</p>
  <div class="actions">
    <button type="button" id="fill" class="primary">Fill this page</button>
    <button type="button" id="edit">Edit profile</button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <p class="muted small">Shortcut: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>F</kbd>. Nothing is ever submitted.</p>
  <script src="popup.js"></script>
</body>
</html>
